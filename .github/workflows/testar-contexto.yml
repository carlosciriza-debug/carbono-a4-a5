name: Testar Contexto 3D
on:
  push:
    branches: [f07-3d-contexto]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=./
      - uses: actions/upload-artifact@v7
        with:
          name: carbonroute-3d-preview
          path: dist/
          if-no-files-found: error
