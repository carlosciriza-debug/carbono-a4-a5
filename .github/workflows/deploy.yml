name: Publicar demonstração 3D
on:
  push:
    branches: [preview-3d]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: producao
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: demonstracao
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            producao/package-lock.json
            demonstracao/package-lock.json
      - name: Compilar versão estável
        working-directory: producao
        run: |
          npm ci
          npm test
          npm run build -- --base=/carbono-a4-a5/
      - name: Compilar demonstração 3D
        working-directory: demonstracao
        run: |
          npm ci
          npm test
          npm run build -- --base=/carbono-a4-a5/preview-3d/
      - name: Reunir versões
        run: |
          mkdir -p site/preview-3d
          cp -a producao/dist/. site/
          cp -a demonstracao/dist/. site/preview-3d/
          test -f site/index.html
          test -f site/preview-3d/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
